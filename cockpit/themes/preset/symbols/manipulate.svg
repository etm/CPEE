<svg class="clickable" xmlns="http://www.w3.org/2000/svg">
  <g class="replace">
    <g class="part-normal">
      <rect x="1" y="1" width="28" height="28" rx="4" class="hfill rfill cline stand"/>
      <text transform="translate(15,21)" class="normal">s</text>
    </g>
    <g class="part-start" clip-path="url(#startclip)">
      <rect x="1" y="1" width="38" height="28" rx="4" class="hfill rfill cline stand"/>
      <text transform="translate(15,20.5)" class="normal">s</text>
    </g>
    <g class="part-end" clip-path="url(#endclip)">
      <rect x="1" y="1" width="28" height="28" rx="4" class="hfill rfill cline stand"/>
    </g>
    <g class="part-middle" transform="translate(28,0)">
      <rect x="0" y="1" width="120" height="28" class="hfill rfill standwithout"/>
      <line x1="0" y1="1" x2="120" y2="1" class="standline cline" />
      <line x1="0" y1="29" x2="121" y2="29" class="standline cline" />
      <text style="margin-left:1em;" transform="translate(0,20)" class="label"></text>
    </g>
  </g>
</svg>
